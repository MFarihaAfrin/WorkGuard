<!DOCTYPE html>
<html>
<head>
<style>
    body { font-family: Helvetica, sans-serif; color: #1F2937; padding: 20px; text-align: center;}
    h1 { color: #134E4A; font-size: 20px; margin-bottom: 4px; }
    p.subtitle { color: #6B7280; font-size: 11px; margin-top: 0; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #E5E7EB; padding: 8px; font-size: 11px; text-align: left; }
    th { background-color: #134E4A; color: white; }
    tr:nth-child(even) { background-color: #F8FAFC; }
</style>
</head>
<body>
    <h1>WorkGuard — Attendance Report</h1>

    <table>
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Total Days</th>
            <th>Present</th>
            <th>Absent</th>
            <th>Attendance %</th>
            
        </tr>
        {% for row in report %}
        <tr>
            <td>{{ row.employee.employee_id }}</td>
            <td>{{ row.employee.full_name }}</td>
            <td>{{ row.total }}</td>
            <td>{{ row.present }}</td>
            <td>{{ row.absent }}</td>
            <td>{{ row.percent }}%</td>
        
        </tr>
        {% endfor %}
    </table>
</body>
</html>
